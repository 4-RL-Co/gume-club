services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gume
      POSTGRES_PASSWORD: gume
      POSTGRES_DB: gume
    ports:
      - "5432:5432"
    volumes:
      - gume_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gume"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gume_pgdata:
